plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'io.qameta.allure' version '3.0.2'
}

group = 'sicredi-api-lab'
version = '0.0.1-SNAPSHOT'

repositories {
	mavenCentral()
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

ext {
	set('googleGuavaVersion', '33.0.0-jre')
	set('restAssured', '5.4.0')
	set('groovyVersion', '4.0.28')
	set('jacksonDatabindVersion', '2.18.2')
}

dependencyManagement {
	dependencies {
		dependencySet(group: 'org.apache.groovy', version: "$groovyVersion") {
			entry 'groovy'
			entry 'groovy-json'
			entry 'groovy-xml'
		}
	}
}

dependencies {
	// --- Spring
	implementation('org.springframework.boot:spring-boot-starter')
	implementation('org.springframework.boot:spring-boot-starter-web')

	// --- Test
	testImplementation('org.springframework.boot:spring-boot-starter-test')

	// para o classpath de teste.
	testImplementation("com.fasterxml.jackson.core:jackson-databind:$jacksonDatabindVersion")

	// --- Google Guava
	implementation("com.google.guava:guava:$googleGuavaVersion")

	// --- RestAssured
	testImplementation("io.rest-assured:rest-assured:$restAssured")

	// --- Allure
	testImplementation('io.qameta.allure:allure-rest-assured:2.14.0')
}

tasks.named('test') {
	useJUnitPlatform()
}